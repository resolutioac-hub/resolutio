<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — Resolutio</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/resolutio-redesign.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,600&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --font-display: 'Cormorant Garamond', 'Instrument Serif', Georgia, serif; --font-body: 'Space Grotesk', 'Albert Sans', sans-serif; }
  body { font-family: var(--font-body); background: linear-gradient(170deg, #fcfaf6 0%, #f4efe8 100%); color: #1a1715; overflow-x: hidden; }
  .sidebar { width: 260px; background: linear-gradient(180deg, #fff 0%, #fdfaf7 100%); border-right: 1px solid var(--line); position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; z-index: 100; overflow-y: auto; box-shadow: 6px 0 20px rgba(30,21,19,0.04); }
  .sidebar__brand { padding: 28px 22px 22px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .nav__label { font-family: var(--font-body); font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); padding: 18px 14px 8px; }
  .nav__item { color: var(--text); font-size: 0.82rem; padding: 10px 14px; border-radius: 10px; transition: background 150ms ease; display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav__item:hover { background: var(--primary-50); color: var(--primary-700); }
  .nav__item--active { background: var(--primary); color: #fff; font-weight: 700; box-shadow: 0 4px 14px rgba(114,80,71,0.25); }
  .nav__icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  .nav__icon svg { width: 16px; height: 16px; }
  .sidebar__footer { padding: 16px; border-top: 1px solid var(--line-soft); margin-top: auto; }
  .user { background: rgba(255,255,255,0.8); border-radius: 14px; padding: 12px; border: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .user__avatar { background: linear-gradient(135deg, var(--primary), var(--primary-700)); box-shadow: 0 4px 12px rgba(114,80,71,0.25); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.72rem; color: #fff; }
  .user__name { color: var(--ink); font-weight: 600; font-size: 0.80rem; }
  .user__email { color: var(--muted); font-size: 0.66rem; }
  .main { flex: 1; margin-left: 260px; min-height: 100vh; }
  .topbar { height: 72px; background: rgba(255,255,255,0.75); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(30,21,19,0.06); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 50; }
  .topbar__title { font-family: var(--font-body); font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  .topbar__subtitle { font-size: 0.80rem; color: var(--muted); }
  .page { padding: 28px 32px; max-width: 1180px; width: 100%; margin: 0 auto; }
  @keyframes riseUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
  .anim-up { opacity: 0; transform: translateY(28px); }
  .anim-up.is-visible { animation: riseUp 0.9s cubic-bezier(0.22,1,0.36,1) both; }

  /* Filter tabs */
  .filter-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-tab { padding: 7px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: all 150ms; font-family: var(--font-body); color: var(--muted); }
  .filter-tab:hover { border-color: var(--primary-200); color: var(--primary); }
  .filter-tab--active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* Stats row */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 18px; text-align: center; box-shadow: 0 4px 12px rgba(30,21,19,0.03); }
  .stat-value { font-family: var(--font-display); font-size: 2rem; font-weight: 300; color: var(--ink); }
  .stat-label { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  .section-card { background: #fff; border: 1.5px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: 0 8px 24px rgba(30,21,19,0.04); margin-bottom: 20px; }
  .section-card__title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 400; color: var(--ink); margin-bottom: 16px; }
  .day-group { margin-bottom: 24px; }
  .day-label { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase; color: var(--primary); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--primary-100); }
  .meet-card { background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; display: flex; gap: 14px; align-items: center; margin-bottom: 10px; transition: transform 200ms, box-shadow 200ms; }
  .meet-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(114,80,71,0.08); }
  .meet-time { font-size: 0.85rem; font-weight: 700; color: var(--primary); min-width: 50px; }
  .meet-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .meet-dot--agendado { background: var(--primary); }
  .meet-dot--realizado { background: #10b981; }
  .meet-dot--cancelado { background: var(--muted); }
  .meet-dot--remarcado { background: #d97706; }
  .meet-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
  .meet-actions .btn { font-size: 0.68rem; padding: 5px 10px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
  .badge--info { background: #eef2ff; color: #465fff; }
  .badge--success { background: #ecfdf5; color: #10b981; }
  .badge--warning { background: #fffbeb; color: #d97706; }
  .badge--muted { background: var(--line-soft); color: var(--muted); }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 200ms; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: #fff; border-radius: 20px; width: 90%; max-width: 520px; max-height: 85vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(30,21,19,0.18); }
  .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; }
  .modal-header h3 { font-family: var(--font-display); font-size: 1.3rem; font-weight: 400; color: var(--ink); }
  .modal-close { background: none; border: none; font-size: 1.4rem; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: background 150ms; }
  .modal-close:hover { background: var(--line-soft); }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px 20px; border-top: 1px solid var(--line-soft); display: flex; justify-content: flex-end; gap: 8px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .form-control { width: 100%; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 0.85rem; font-family: var(--font-body); color: var(--ink); background: #fff; transition: border-color 150ms, box-shadow 150ms; }
  .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(114,80,71,0.10); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 10px; font-size: 0.82rem; font-weight: 650; border: 1.5px solid transparent; cursor: pointer; transition: all 150ms; font-family: var(--font-body); white-space: nowrap; }
  .btn:active { transform: scale(0.97); }
  .btn--primary { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 12px rgba(114,80,71,0.18); }
  .btn--primary:hover { background: var(--primary-700); box-shadow: 0 6px 16px rgba(114,80,71,0.22); transform: translateY(-1px); }
  .btn--ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .btn--ghost:hover { background: var(--primary-50); color: var(--primary); border-color: var(--primary-200); }
  .btn--success { background: #10b981; color: #fff; border-color: #10b981; }
  .btn--success:hover { background: #059669; }
  .btn--danger { background: #ef4444; color: #fff; border-color: #ef4444; }
  .btn--danger:hover { background: #dc2626; }
  .btn--warning { background: #d97706; color: #fff; border-color: #d97706; }
  .btn--warning:hover { background: #b45309; }
  .btn--sm { font-size: 0.74rem; padding: 6px 12px; border-radius: 8px; }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty-state svg { width: 48px; height: 48px; color: var(--line); margin-bottom: 12px; }
  .empty-state p { font-size: 0.88rem; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .sidebar.is-open { display: flex; }
    .main { margin-left: 0; }
    .page { padding: 16px; }
    .stats-row { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .meet-card { flex-wrap: wrap; }
    .meet-actions { width: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <img src="../assets/images/logo-branca.png" alt="Resolutio" style="width:100%;max-width:180px;height:auto;object-fit:contain">
    </div>
    <nav class="sidebar__nav" id="dynamicNav"></nav>
    <div class="sidebar__footer">
      <div class="user"><div class="user__avatar" id="userAvatar">FU</div><div><div class="user__name" id="userName">Funcionário</div><div class="user__email" id="userEmail">funcionario@resolutio.com</div></div></div>
      <button class="btn btn--danger btn--sm" style="width:100%;margin-top:10px" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px;height:14px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Sair</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;gap:12px;align-items:center">
        <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('is-open')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div>
          <div class="topbar__title">Minha agenda</div>
          <div class="topbar__subtitle">Gerencie seus encontros</div>
        </div>
      </div>
      <button class="btn btn--primary btn--sm" onclick="openNewEncontro()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg>
        Novo encontro
      </button>
    </header>

    <div class="page">
      <!-- Stats -->
      <div class="stats-row anim-up">
        <div class="stat-card"><div class="stat-value" id="statAgendados">0</div><div class="stat-label">Agendados</div></div>
        <div class="stat-card"><div class="stat-value" id="statRealizados">0</div><div class="stat-label">Realizados</div></div>
        <div class="stat-card"><div class="stat-value" id="statSemana">0</div><div class="stat-label">Esta semana</div></div>
      </div>

      <!-- Filters -->
      <div class="filter-tabs anim-up">
        <button class="filter-tab filter-tab--active" data-filter="all" onclick="setFilter('all')">Todos</button>
        <button class="filter-tab" data-filter="agendado" onclick="setFilter('agendado')">Agendados</button>
        <button class="filter-tab" data-filter="realizado" onclick="setFilter('realizado')">Realizados</button>
        <button class="filter-tab" data-filter="cancelado" onclick="setFilter('cancelado')">Cancelados</button>
      </div>

      <!-- Encontros list -->
      <div class="section-card anim-up">
        <h2 class="section-card__title">Encontros</h2>
        <div id="encontrosList"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Novo Encontro -->
<div class="modal-overlay" id="newEncontroModal">
  <div class="modal">
    <div class="modal-header"><h3 id="encontroModalTitle">Novo encontro</h3><button class="modal-close" onclick="closeNewEncontro()" aria-label="Fechar">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="editEncontroId">
      <div class="form-group"><label for="encontroCliente">Cliente</label><select id="encontroCliente" class="form-control"></select></div>
      <div class="form-group"><label for="encontroTitulo">Título</label><input id="encontroTitulo" class="form-control" placeholder="Ex: Mentoria Pilar 2"></div>
      <div class="form-row">
        <div class="form-group"><label for="encontroData">Data</label><input id="encontroData" class="form-control" type="date"></div>
        <div class="form-group"><label for="encontroHora">Hora</label><input id="encontroHora" class="form-control" type="time" value="14:00"></div>
      </div>
      <div class="form-group"><label for="encontroMeet">Link do Google Meet</label><input id="encontroMeet" class="form-control" placeholder="https://meet.google.com/..."></div>
      <div class="form-row">
        <div class="form-group"><label for="encontroPilar">Pilar</label><select id="encontroPilar" class="form-control"><option value="1">Pilar 1 — Mapeamento</option><option value="2">Pilar 2 — Arquitetura</option><option value="3">Pilar 3 — Banca</option><option value="4">Pilar 4 — Aprovação</option></select></div>
        <div class="form-group"><label for="encontroStatus">Status</label><select id="encontroStatus" class="form-control"><option value="agendado">Agendado</option><option value="realizado">Realizado</option><option value="cancelado">Cancelado</option><option value="remarcado">Remarcado</option></select></div>
      </div>
      <div class="form-group"><label for="encontroObs">Observações</label><textarea id="encontroObs" class="form-control" rows="3" placeholder="Anotações sobre o encontro..."></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn--ghost" onclick="closeNewEncontro()">Cancelar</button><button class="btn btn--primary" onclick="saveEncontro()">Salvar encontro</button></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="./funcionario-nav.js"></script>
<script>
  requireAuth(['funcionario']); setupSidebar(); renderFuncionarioNav('agendamento');

  let currentFilter = 'all';
  let meusClientes = [];
  let meusEncontros = [];
  let funcNome = '';

  function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('filter-tab--active', t.dataset.filter === filter));
    renderEncontros();
  }

  function openNewEncontro() {
    document.getElementById('editEncontroId').value = '';
    document.getElementById('encontroModalTitle').textContent = 'Novo encontro';
    document.getElementById('encontroTitulo').value = '';
    document.getElementById('encontroData').value = new Date().toISOString().slice(0, 10);
    document.getElementById('encontroHora').value = '14:00';
    document.getElementById('encontroMeet').value = '';
    document.getElementById('encontroPilar').value = '1';
    document.getElementById('encontroStatus').value = 'agendado';
    document.getElementById('encontroObs').value = '';
    populateClienteSelect();
    document.getElementById('newEncontroModal').classList.add('open');
  }

  function openEditEncontro(id) {
    const e = meusEncontros.find(x => x.id === id);
    if (!e) return;
    document.getElementById('editEncontroId').value = e.id;
    document.getElementById('encontroModalTitle').textContent = 'Editar encontro';
    populateClienteSelect(e.cliente);
    document.getElementById('encontroTitulo').value = e.titulo || '';
    const dt = e.data ? new Date(e.data.replace(' ', 'T')) : new Date();
    document.getElementById('encontroData').value = dt.toISOString().slice(0, 10);
    document.getElementById('encontroHora').value = dt.toTimeString().slice(0, 5);
    document.getElementById('encontroMeet').value = e.meet || '';
    document.getElementById('encontroPilar').value = e.pilar || 1;
    document.getElementById('encontroStatus').value = e.status || 'agendado';
    document.getElementById('encontroObs').value = e.observacoes || '';
    document.getElementById('newEncontroModal').classList.add('open');
  }

  function closeNewEncontro() { document.getElementById('newEncontroModal').classList.remove('open'); }

  function populateClienteSelect(selected) {
    const sel = document.getElementById('encontroCliente');
    sel.innerHTML = meusClientes.map(c => `<option value="${c.nome}" ${c.nome === selected ? 'selected' : ''}>${c.nome}</option>`).join('');
    if (!meusClientes.length) sel.innerHTML = '<option value="">Nenhum cliente atribuído</option>';
  }

  async function saveEncontro() {
    const editId = document.getElementById('editEncontroId').value;
    const cliente = document.getElementById('encontroCliente').value;
    const titulo = document.getElementById('encontroTitulo').value.trim();
    const data = document.getElementById('encontroData').value;
    const hora = document.getElementById('encontroHora').value;
    const meet = document.getElementById('encontroMeet').value.trim();
    const pilar = parseInt(document.getElementById('encontroPilar').value);
    const status = document.getElementById('encontroStatus').value;
    const observacoes = document.getElementById('encontroObs').value.trim();

    if (!cliente) return toast('Selecione um cliente.', 'error');
    if (!titulo) return toast('Informe o título do encontro.', 'error');
    if (!data) return toast('Informe a data.', 'error');

    const dateTime = data + ' ' + (hora || '14:00');
    const payload = { cliente, titulo, data: dateTime, meet, pilar, status, observacoes, funcionario: funcNome };

    try {
      if (editId) {
        await API.encontros.update(editId, payload);
        toast('Encontro atualizado!');
      } else {
        await API.encontros.create(payload);
        // Atualizar proximo_encontro do cliente
        const c = meusClientes.find(x => x.nome === cliente);
        if (c) await API.clientes.update(c.id, { proximo_encontro: dateTime });
        toast('Encontro agendado!');
      }
      closeNewEncontro();
      load();
    } catch (error) { toast(error.message, 'error'); }
  }

  async function markRealizado(id) {
    try {
      await API.encontros.update(id, { status: 'realizado' });
      toast('Encontro marcado como realizado!');
      load();
    } catch (error) { toast(error.message, 'error'); }
  }

  async function cancelEncontro(id) {
    if (!confirm('Deseja cancelar este encontro?')) return;
    try {
      await API.encontros.update(id, { status: 'cancelado' });
      toast('Encontro cancelado.');
      load();
    } catch (error) { toast(error.message, 'error'); }
  }

  function copyMeet(link) {
    if (!link) return toast('Nenhum link do Meet definido.', 'error');
    navigator.clipboard.writeText(link).then(() => toast('Link do Meet copiado!')).catch(() => toast('Erro ao copiar.', 'error'));
  }

  function renderEncontros() {
    const filtered = currentFilter === 'all' ? meusEncontros : meusEncontros.filter(e => e.status === currentFilter);

    if (!filtered.length) {
      const msg = currentFilter === 'all' ? 'Nenhum encontro registrado.' : `Nenhum encontro com status "${currentFilter}".`;
      document.getElementById('encontrosList').innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><p>${msg}</p></div>`;
      return;
    }

    const porDia = {};
    filtered.sort((a, b) => a.data.localeCompare(b.data)).forEach(e => {
      const dt = new Date(e.data.replace(' ', 'T'));
      const dia = isNaN(dt) ? 'Data inválida' : dt.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      if (!porDia[dia]) porDia[dia] = [];
      porDia[dia].push(e);
    });

    let html = '';
    Object.entries(porDia).forEach(([dia, encontros]) => {
      html += `<div class="day-group"><div class="day-label">${dia}</div>`;
      encontros.forEach(e => {
        const dt = new Date(e.data.replace(' ', 'T'));
        const hora = isNaN(dt) ? '--:--' : dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const statusClass = e.status || 'agendado';
        const statusLabel = labelForStatus(e.status) || 'Agendado';
        const badgeClass = e.status === 'realizado' ? 'badge--success' : e.status === 'cancelado' ? 'badge--muted' : e.status === 'remarcado' ? 'badge--warning' : 'badge--info';

        let actions = '';
        if (e.status === 'agendado' || e.status === 'remarcado') {
          actions = `
            <button class="btn btn--success btn--sm" onclick="markRealizado('${e.id}')" title="Marcar como realizado">✓ Realizado</button>
            <button class="btn btn--ghost btn--sm" onclick="openEditEncontro('${e.id}')" title="Editar">Editar</button>
            <button class="btn btn--ghost btn--sm" onclick="cancelEncontro('${e.id}')" title="Cancelar" style="color:#ef4444">Cancelar</button>
            ${e.meet ? `<button class="btn btn--ghost btn--sm" onclick="copyMeet('${e.meet}')" title="Copiar link do Meet">📋 Meet</button>` : ''}
          `;
        } else if (e.status === 'realizado') {
          actions = `<button class="btn btn--ghost btn--sm" onclick="openEditEncontro('${e.id}')">Ver detalhes</button>`;
        }

        html += `<div class="meet-card">
          <div class="meet-time">${hora}</div>
          <div class="meet-dot meet-dot--${statusClass}"></div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:0.90rem;color:var(--ink)">${e.titulo || 'Sem título'}</div>
            <div style="font-size:0.80rem;color:var(--muted);margin-top:2px">${e.cliente}${e.pilar ? ' · Pilar ' + e.pilar : ''}${e.observacoes ? ' · ' + e.observacoes.slice(0, 60) : ''}</div>
          </div>
          <span class="badge ${badgeClass}"><span class="badge-dot"></span>${statusLabel}</span>
          <div class="meet-actions">${actions}</div>
        </div>`;
      });
      html += '</div>';
    });

    document.getElementById('encontrosList').innerHTML = html;
  }

  async function load() {
    const user = getSession().user;
    const nome = user?.nome || user?.email?.split('@')[0] || 'funcionário';
    const funcionarios = await API.funcionarios.list();
    const func = funcionarios.find(f => f.email === user?.email || f.nome === nome);
    funcNome = func?.nome || nome;

    const clientes = await API.clientes.list();
    meusClientes = clientes.filter(c => c.funcionario === funcNome);

    const encontros = await API.encontros.list();
    meusEncontros = encontros.filter(e => e.funcionario === funcNome);

    // Stats
    const agendados = meusEncontros.filter(e => e.status === 'agendado' || e.status === 'remarcado').length;
    const realizados = meusEncontros.filter(e => e.status === 'realizado').length;
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 7);
    const semana = meusEncontros.filter(e => { const d = new Date(e.data.replace(' ', 'T')); return d >= weekStart && d < weekEnd; }).length;

    document.getElementById('statAgendados').textContent = agendados;
    document.getElementById('statRealizados').textContent = realizados;
    document.getElementById('statSemana').textContent = semana;

    renderEncontros();
  }
  load();

  // Click outside modal to close
  document.getElementById('newEncontroModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeNewEncontro(); });

  document.querySelectorAll('.anim-up').forEach(el => {
    const rect = el.getBoundingClientRect();
    if (rect.top < window.innerHeight) el.classList.add('is-visible');
  });
</script>
</body>
</html>

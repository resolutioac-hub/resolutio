<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materiais — Resolutio</title>
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/resolutio-redesign.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,600&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --font-display: 'Cormorant Garamond', 'Instrument Serif', Georgia, serif; --font-body: 'Space Grotesk', 'Albert Sans', sans-serif; }
  body { font-family: var(--font-body); background: linear-gradient(170deg, #fcfaf6 0%, #f4efe8 100%); color: #1a1715; overflow-x: hidden; }
  .sidebar { width: 200px; background: linear-gradient(180deg, #1a1715 0%, #100e0c 100%); border-right: 1px solid var(--line); position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; z-index: 100; overflow-y: auto; box-shadow: 6px 0 20px rgba(30,21,19,0.04); }
  .sidebar__brand { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; }
  .sidebar__logo { width: 44px; height: 44px; border-radius: 50%; background: var(--primary-50); border: 1px solid var(--primary-200); padding: 2px; margin-bottom: 12px; }
  .sidebar__logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .sidebar__title { font-family: var(--font-body); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.15em; color: #fff; text-transform: uppercase; text-align: center; width: 100%; }
  .nav__label { font-family: var(--font-body); font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); padding: 18px 14px 8px; }
  .nav__item { color: var(--text); font-size: 0.82rem; padding: 10px 14px; border-radius: 10px; transition: background 150ms ease; display: flex; align-items: center; gap: 10px; }
  .nav__item:hover { background: var(--primary-50); color: var(--primary-700); }
  .nav__item--active { background: var(--primary); color: #fff; font-weight: 700; box-shadow: 0 4px 14px rgba(114,80,71,0.25); }
  .nav__icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
  .nav__icon svg { width: 16px; height: 16px; }
  .sidebar__footer { padding: 16px; border-top: 1px solid var(--line-soft); }
  .user { background: rgba(255,255,255,0.8); border-radius: 14px; padding: 12px; border: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .user__avatar { background: linear-gradient(135deg, var(--primary), var(--primary-700)); box-shadow: 0 4px 12px rgba(114,80,71,0.25); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.72rem; color: #fff; }
  .user__name { color: var(--ink); font-weight: 600; font-size: 0.80rem; }
  .user__email { color: var(--muted); font-size: 0.66rem; }
  .main { flex: 1; margin-left: 200px; min-height: 100vh; }
  .topbar { height: 56px; background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 50; }
  .topbar__title { font-family: var(--font-body); font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  .topbar__subtitle { font-size: 0.80rem; color: var(--muted); }
  .page { padding: 28px 32px; max-width: 900px; width: 100%; margin: 0 auto; }
  @keyframes riseUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
  .anim-up { opacity: 0; transform: translateY(28px); }
  .anim-up.is-visible { animation: riseUp 0.9s cubic-bezier(0.22,1,0.36,1) both; }
  .section-card { background: #fff; border: 1.5px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: 0 8px 24px rgba(30,21,19,0.04); margin-bottom: 20px; }
  .section-card__title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 400; color: var(--ink); margin-bottom: 16px; }
  .material-card { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
  .material-card:last-child { border-bottom: none; }
  .material-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--primary-50); border: 1px solid var(--primary-200); display: flex; align-items: center; justify-content: center; color: var(--primary); flex-shrink: 0; }
  .material-icon svg { width: 18px; height: 18px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
  .badge--primary { background: var(--primary-50); color: var(--primary); }
  @media (max-width: 768px) { .page { padding: 16px; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <img src="../assets/images/logo-branca.png" alt="Resolutio" style="width:100%;max-width:180px;height:auto;object-fit:contain">
    </div>
    <nav class="sidebar__nav">
      <div class="nav__label">Menu</div>
      <a class="nav__item" href="./dashboard.html"><span class="nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span> Início</a>
      <a class="nav__item" href="./agendar.html"><span class="nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span> Agendar encontro</a>
      <a class="nav__item" href="./encontros.html"><span class="nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Meus encontros</a>
      <a class="nav__item nav__item--active" href="./materiais.html"><span class="nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span> Materiais</a>
      <a class="nav__item" href="./pagamentos.html"><span class="nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h4M6 14h7"/></svg></span> Pagamentos</a>
    </nav>
    <div class="sidebar__footer">
      <div class="user"><div class="user__avatar">CL</div><div class="user__name">Cliente</div><div class="user__email">cliente@email.com</div></div>
      <button class="btn btn--danger btn--sm" style="width:100%;margin-top:10px" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px;height:14px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Sair</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;gap:12px;align-items:center">
        <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('is-open')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div>
          <div class="topbar__title">Materiais</div>
          <div class="topbar__subtitle">Seus documentos e editais</div>
        </div>
      </div>
    </header>

    <div class="page">
      <div class="section-card anim-up">
        <h2 class="section-card__title">Meus materiais</h2>
        <div id="materiaisList"></div>
      </div>
    </div>
  </div>
</div>

<script src="../js/filestore.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script>
  requireAuth(['cliente']); setupSidebar();

  const tipoLabel = { edital: 'Edital', projeto: 'Projeto', material_estudo: 'Material de estudo', outro: 'Outro' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
  }

  async function abrirMaterial(id) {
    try {
      const url = await API.materiais.abrirArquivo(id);
      if (!url) return toast('Material sem arquivo anexado.', 'error');
      const win = window.open(url, '_blank');
      if (!win) toast('Permita pop-ups no seu navegador para abrir o documento.', 'warning');
    } catch (e) { toast(e.message, 'error'); }
  }

  async function baixarMaterial(id) {
    try {
      await API.materiais.baixarArquivo(id);
    } catch (e) { toast(e.message, 'error'); }
  }

  async function load() {
    const user = getSession().user;
    const nome = user?.nome || user?.email?.split('@')[0] || 'cliente';

    const materiais = await API.materiais.list();
    const meusMateriais = materiais.filter(m => m.cliente === nome);

    if (!meusMateriais.length) {
      document.getElementById('materiaisList').innerHTML = '<p style="color:var(--muted);font-size:0.85rem;text-align:center;padding:40px 0">Nenhum material disponível no momento.</p>';
      return;
    }

    document.getElementById('materiaisList').innerHTML = meusMateriais.map(m => {
      const temArquivo = API.materiais.temArquivo(m);
      const tamanho = m.arquivo_tamanho ? ' · ' + FileStore.formatBytes(m.arquivo_tamanho) : '';
      return `
      <div class="material-card">
        <div class="material-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:0.90rem;color:var(--ink)">${esc(m.titulo)}</div>
          <div style="font-size:0.78rem;color:var(--muted);margin-top:2px">${formatDate(m.data)}${tamanho}</div>
        </div>
        <span class="badge badge--primary">${tipoLabel[m.tipo] || esc(m.tipo)}</span>
        ${temArquivo ? `<button class="btn btn--primary btn--sm" onclick="abrirMaterial('${m.id}')">Abrir</button>
        <button class="btn btn--ghost btn--sm" onclick="baixarMaterial('${m.id}')">⬇</button>` : '<span style="font-size:0.72rem;color:var(--muted)">Sem arquivo</span>'}
      </div>`;
    }).join('');
  }
  load();

  document.querySelectorAll('.anim-up').forEach(el => {
    const rect = el.getBoundingClientRect();
    if (rect.top < window.innerHeight) el.classList.add('is-visible');
  });
</script>
</body>
</html>
